<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Kinship training dashboard" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">K</span>
      <span>Kinship</span>
    </a>

    <button
      class="menu-button"
      type="button"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <span></span><span></span><span></span>
    </button>

    <nav class="primary-nav" aria-label="Primary navigation" [class.is-open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/clients" routerLinkActive="active" (click)="closeMenu()">People</a>
      <a routerLink="/workouts" routerLinkActive="active" (click)="closeMenu()">Plans</a>
      <a routerLink="/progress" routerLinkActive="active" (click)="closeMenu()">Insights</a>
    </nav>

    <a class="new-session" routerLink="/session/new" (click)="closeMenu()">
      <span aria-hidden="true">＋</span>
      <span>Start session</span>
    </a>
    <div class="coach-avatar" aria-label="Signed in as Wesley, coach">WC</div>
  </header>

  <main class="page-shell">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Mobile navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><span aria-hidden="true">⌂</span>Home</a>
    <a routerLink="/clients" routerLinkActive="active"><span aria-hidden="true">◉</span>People</a>
    <a class="bottom-start" routerLink="/session/new"><span aria-hidden="true">＋</span>Log</a>
    <a routerLink="/workouts" routerLinkActive="active"><span aria-hidden="true">▤</span>Plans</a>
    <a routerLink="/progress" routerLinkActive="active"><span aria-hidden="true">↗</span>Insights</a>
  </nav>
</div>
